name: Publish to JSR

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # DO NOT pin this to chase the missing JSR provenance — that was tried on 2026-07-30 and
      # RULED OUT. The provenance history splits exactly on a Deno release boundary (Deno <= 2.9.1
      # attested: v1.7.0/v1.11.1/v1.11.2; Deno >= 2.9.2 not: v1.11.3 … v1.11.12), which looked
      # causal, so v2.0.0 was published with `deno-version: v2.9.1` pinned. **It published with no
      # provenance anyway** (JSR `rekorLogId` null), so the Deno version is NOT the cause and the
      # correlation was coincidental. Restored to floating `v2.x`; the remaining suspects are
      # JSR-side and GitHub-side changes in the 2026-07-03 → 07-09 window. The "Verify provenance"
      # step at the end of this job is what will detect a fix whenever one lands.
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Provenance requires a GitHub OIDC token. The `id-token: write` permission
      # above is what injects ACTIONS_ID_TOKEN_REQUEST_URL/_TOKEN into the runner.
      # If they are absent here despite the permission, an org/enterprise Actions
      # OIDC policy is blocking the token and `deno publish` will silently skip
      # provenance (publish still succeeds). This makes that failure mode visible.
      - name: Check OIDC availability (provenance prerequisite)
        run: |
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "OIDC token endpoint available — provenance prerequisites met."
          else
            echo "::warning::OIDC token NOT available (URL present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}, TOKEN present: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}). deno publish will skip provenance. Verify id-token:write is honored — check org/enterprise Settings → Actions → General OIDC policy."
          fi

      - name: Publish to JSR
        run: deno publish

      - name: Create release branch
        run: |
          git checkout -b release/${GITHUB_REF_NAME}
          git push origin release/${GITHUB_REF_NAME}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${GITHUB_REF_NAME} \
            --title "${GITHUB_REF_NAME}" \
            --target release/${GITHUB_REF_NAME} \
            --generate-notes

      # The OIDC step above only proves the PREREQUISITE was met. It passed on every release from
      # v1.11.3 onward while JSR recorded NO provenance at all (rekorLogId null, v1.11.2 was the
      # last version that had one) — ten releases of false assurance. This checks the OUTCOME: JSR
      # is the authority on whether a provenance statement actually landed in the Sigstore Rekor
      # transparency log. Runs last so a failure here never blocks the publish or the GitHub
      # release, but still fails the job loudly instead of letting the regression stay invisible.
      - name: Verify provenance was recorded on JSR
        run: |
          PKG=$(deno eval 'console.log(JSON.parse(Deno.readTextFileSync("deno.json")).name)')
          SCOPE=${PKG%/*}; SCOPE=${SCOPE#@}
          NAME=${PKG#*/}
          VERSION=${GITHUB_REF_NAME#v}
          URL="https://api.jsr.io/scopes/${SCOPE}/packages/${NAME}/versions/${VERSION}"
          echo "Checking $URL"
          # JSR ingests asynchronously, so poll rather than reading once.
          for i in $(seq 1 12); do
            # The JSR version endpoint is CACHED, and attestation is written a few
            # seconds AFTER publish, so a plain re-read can keep returning the
            # pre-attestation record for minutes and report a FALSE negative on a
            # release that did get provenance. Measured 2026-08-27 on
            # wabt-ts@1.5.1: eight plain reads over ~3 minutes all returned null,
            # while one cache-busted read showed rekorLogId 2618866200, written 4s
            # after publish. Cache-bust, or this step cannot be believed.
            BODY=$(curl -sf -H "Accept: application/json" -H "Cache-Control: no-cache" "${URL}?cb=${GITHUB_RUN_ID}-${i}" || true)
            REKOR=$(printf '%s' "$BODY" | deno eval 'const t=await new Response(Deno.stdin.readable).text(); try { console.log(JSON.parse(t).rekorLogId ?? "") } catch { console.log("") }' || true)
            if [ -n "$REKOR" ]; then
              echo "✅ Provenance recorded — Rekor log ID: $REKOR"
              exit 0
            fi
            echo "  attempt $i: no provenance yet, retrying in 15s"
            sleep 15
          done
          echo "::error::${PKG}@${VERSION} was published WITHOUT provenance (no Sigstore/Rekor entry). Known-absent since v1.11.3 — cause still unidentified. RULED OUT so far: the Deno version (v2.0.0 published on a pinned 2.9.1 and was still unattested); usesNpm (true on BOTH sides of the 1.11.2/1.11.3 boundary); a stale/cached API read (re-checked 2026-08-27 with cache-busting — the absence is real); and a global JSR- or GitHub-side change, because binaryen-ts, wabt-ts and binaryang all published ATTESTED from this same scope on 2026-08-27. Whatever this is, it is specific to wasmtk. The OIDC step above passes, so it is not the token prerequisite. See cmem/design-decisions.md."
          exit 1
